; ============================================================================
; esp32_loraprs_e22 — варіант MeshCore для саморобної плати ESP32-DEV + E22
; (SX1268), зібраної за схемою sh123/esp32_loraprs (піни з variants/esp32dev_e22).
;
; Піни звірені зі схемою KiCad самого проєкту
; (extras/schematics/esp32dev/lora_tracker.sch + нетліст):
;   - NSS/RESET/DIO1/BUSY/RXEN/TXEN/MOSI розведені жорстко (простежено доріжки).
;   - NSS/SCK/MISO проходять через перемички JP1/JP2/JP3 (це і є вибір
;     "плата на 36 чи 38 пінів" із того проєкту). Задані нижче 5/18/19
;     відповідають варіанту зі стандартними пінами ESP32 VSPI - саме на нього
;     за замовчуванням розрахований і власний MeshCore-конфіг esp32_loraprs.
;     Якщо радіо не ініціалізується - перевірте, яка сторона JP1/JP2/JP3 запаяна.
;
; Покладіть усю теку `esp32_loraprs_e22` у <репозиторій MeshCore>/variants/,
; потім збирайте:
;   pio run -e Esp32_loraprs_E22_companion_radio_ble -t upload
; ============================================================================

[Esp32_loraprs_E22]
extends = esp32_base
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags =
  ${esp32_base.build_flags}
  -I variants/esp32_loraprs_e22
  -D ESP32_LORAPRS_E22
  -D ESP32_CPU_FREQ=80
  -D P_LORA_TX_LED=2
  -D PIN_VBAT_READ=36
  -D P_LORA_NSS=5
  -D P_LORA_RESET=27
  -D P_LORA_DIO_1=12
  -D P_LORA_BUSY=14
  -D P_LORA_SCLK=18
  -D P_LORA_MISO=19
  -D P_LORA_MOSI=23
  -D SX126X_RXEN=32
  -D SX126X_TXEN=33
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D RADIO_CLASS=CustomSX1268
  -D WRAPPER_CLASS=CustomSX1268Wrapper
  -D LORA_TX_POWER=22
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/esp32_loraprs_e22>
lib_deps =
  ${esp32_base.lib_deps}

; Дисплея, GPS і кнопки не передбачено — це гола ESP32-DEV + E22, тож тут
; збірка компаньйона без екрана.
;
; ЛІМІТИ РОЗМІРІВ: це КЛАСИЧНИЙ ESP32 (320 КБ DRAM), а не ESP32-S3. Три
; прапорці нижче — найпрожерливіші щодо пам'яті, вони задають розмір
; статичних масивів:
;   MAX_CONTACTS       -> BaseChatMesh::contacts[]    ~184 Б на елемент
;   MAX_GROUP_CHANNELS -> BaseChatMesh::channels[]     ~64 Б на елемент
;   OFFLINE_QUEUE_SIZE -> MyMesh::offline_queue[]      177 Б на елемент
; Якщо перенести сюди щедрі значення з варіанта для ESP32-S3
; (350/40/256 = ~111 КБ статичної DRAM), лінкер переповнює dram0_0_seg на ~39 КБ:
;   "region `dram0_0_seg' overflowed by 39256 bytes"
; Використані тут значення (~52 КБ) лишають запас для стека BLE. Для довідки:
; власний MeshCore-конфіг sh123 для цієї ж плати використовує 150/20.
;
; УВАГА: не додавайте сюди ADMIN_PASSWORD. Це прапорець для repeater/room-server,
; companion_radio його не використовує, а його визначення вмикає блок WiFi-OTA
; у src/helpers/ESP32Board.cpp — і тоді збірка падає з
; "fatal error: AsyncTCP.h: No such file or directory", якщо не підтягнути ще й
; ${esp32_ota.lib_deps}, чого companion-збірці робити немає навіщо.
[env:Esp32_loraprs_E22_companion_radio_ble]
extends = Esp32_loraprs_E22
build_flags =
  ${Esp32_loraprs_E22.build_flags}
  -D MAX_CONTACTS=150
  -D MAX_GROUP_CHANNELS=20
  -D OFFLINE_QUEUE_SIZE=128
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D ADVERT_NAME='"esp32loraprs-E22"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Esp32_loraprs_E22.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${Esp32_loraprs_E22.lib_deps}
  densaugeo/base64 @ ~1.4.0
