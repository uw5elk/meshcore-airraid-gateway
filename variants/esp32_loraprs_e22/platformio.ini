; ============================================================================
; esp32_loraprs_e22 — MeshCore variant for a DIY ESP32-DEV + E22 (SX1268)
; board built per sh123/esp32_loraprs (variants/esp32dev_e22 pin defaults).
;
; Pins verified against the project's own KiCad schematic
; (extras/schematics/esp32dev/lora_tracker.sch + netlist):
;   - NSS/RESET/DIO1/BUSY/RXEN/TXEN/MOSI are hard-wired (confirmed by trace).
;   - NSS/SCK/MISO are routed through solder jumpers JP1/JP2/JP3 (the
;     project's "36-pin vs 38-pin board" option). The values below
;     (5/18/19) are the standard-ESP32-VSPI option, which is also what
;     esp32_loraprs's own official MeshCore config relies on by default.
;     If radio init fails, check which side of JP1/JP2/JP3 is soldered.
;
; Drop this whole `esp32_loraprs_e22` folder into <MeshCore repo>/variants/,
; then build with:
;   pio run -e Esp32_loraprs_E22_companion_radio_ble -t upload
; ============================================================================

[Esp32_loraprs_E22]
extends = esp32_base
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags =
  ${esp32_base.build_flags}
  -I variants/esp32_loraprs_e22
  -D ESP32_LORAPRS_E22
  -D ESP32_CPU_FREQ=80
  -D P_LORA_TX_LED=2
  -D PIN_VBAT_READ=36
  -D P_LORA_NSS=5
  -D P_LORA_RESET=27
  -D P_LORA_DIO_1=12
  -D P_LORA_BUSY=14
  -D P_LORA_SCLK=18
  -D P_LORA_MISO=19
  -D P_LORA_MOSI=23
  -D SX126X_RXEN=32
  -D SX126X_TXEN=33
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D RADIO_CLASS=CustomSX1268
  -D WRAPPER_CLASS=CustomSX1268Wrapper
  -D LORA_TX_POWER=22
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/esp32_loraprs_e22>
lib_deps =
  ${esp32_base.lib_deps}

; No display / GPS / button assumed — a bare ESP32-DEV + E22, so this is the
; no-screen companion build.
;
; SIZE LIMITS: this is a CLASSIC ESP32 (320 KB DRAM), not an ESP32-S3. The
; three flags below are the RAM-hungry ones — they size static arrays:
;   MAX_CONTACTS       -> BaseChatMesh::contacts[]    ~184 B each
;   MAX_GROUP_CHANNELS -> BaseChatMesh::channels[]     ~64 B each
;   OFFLINE_QUEUE_SIZE -> MyMesh::offline_queue[]      177 B each
; Copying an ESP32-S3 variant's generous values (350/40/256 = ~111 KB of
; static DRAM) overflows the linker's dram0_0_seg by ~39 KB:
;   "region `dram0_0_seg' overflowed by 39256 bytes"
; The values used here (~52 KB) leave headroom for the BLE stack. For
; reference, sh123's own MeshCore config for this same board uses 150/20.
;
; NOTE: do NOT add ADMIN_PASSWORD here. It is a repeater/room-server flag,
; unused by companion_radio, and defining it switches on the WiFi-OTA block
; in src/helpers/ESP32Board.cpp — which then fails to compile with
; "fatal error: AsyncTCP.h: No such file or directory" unless
; ${esp32_ota.lib_deps} is pulled in too, which a companion build has no
; reason to do.
[env:Esp32_loraprs_E22_companion_radio_ble]
extends = Esp32_loraprs_E22
build_flags =
  ${Esp32_loraprs_E22.build_flags}
  -D MAX_CONTACTS=150
  -D MAX_GROUP_CHANNELS=20
  -D OFFLINE_QUEUE_SIZE=128
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D ADVERT_NAME='"esp32loraprs-E22"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Esp32_loraprs_E22.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${Esp32_loraprs_E22.lib_deps}
  densaugeo/base64 @ ~1.4.0
